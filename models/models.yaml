models:
  - name: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    type: gguf
    backend: llama-cpp
    model: /models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    warmup_prompt: |
      <|system|>
      You are a helpful assistant.
      <|user|>
      Hello.
      <|assistant|>
    parameters:
      temperature: 0.7
      top_p: 0.9
      n_predict: 100
      n_batch: 4
      stop:
        - "</s>"
    prompt_template: |
      <|system|>
      {{.SystemPrompt}}
      <|user|>
      {{.Prompt}}
      <|assistant|>
